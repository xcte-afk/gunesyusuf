<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beni Seviyor Musun?</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Playfair+Display:wght@600&display=swap');

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      padding: 20px 15px;
      color: #333;
    }

    /* Zarif Emoji Yağmuru */
    .emoji-rain {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.6;
    }

    .emoji {
      position: absolute;
      font-size: 1.8rem;
      animation: fall linear infinite;
      opacity: 0.5;
    }

    @keyframes fall {
      to { transform: translateY(110vh); }
    }

    /* Soru Card */
    .card {
      background: white;
      border: 3px solid #FFBB00;
      border-radius: 28px;
      padding: 45px 30px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(255, 187, 0, 0.18);
      z-index: 10;
      width: 100%;
      max-width: 360px;
      transition: all 0.6s ease;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      color: #FF9900;
      margin: 0;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    /* Cevap Card */
    .answer-card {
      background: white;
      border: 3px solid #FFBB00;
      border-radius: 28px;
      padding: 45px 30px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(255, 187, 0, 0.22);
      z-index: 10;
      width: 100%;
      max-width: 360px;
      display: none;
    }

    h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.35rem;
      color: #FF9900;
      margin: 0 0 16px 0;
    }

    .message {
      font-size: 1.35rem;
      color: #555;
      line-height: 1.5;
    }

    /* Butonlar */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 360px;
      z-index: 10;
      margin-top: 20px;
    }

    button {
      padding: 18px 40px;
      font-size: 1.32rem;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.4s ease;
    }

    #yesBtn {
      background: linear-gradient(135deg, #FFBB00, #FF9900);
      color: #222;
      box-shadow: 0 8px 25px rgba(255, 187, 0, 0.3);
    }

    #yesBtn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(255, 187, 0, 0.4);
    }

    #noBtn {
      background: #f0f0f0;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="emoji-rain" id="rain"></div>

  <!-- Soru Card -->
  <div class="card" id="questionCard">
    <h1>Beni Seviyor Musun?</h1>
  </div>

  <!-- Cevap Card -->
  <div class="answer-card" id="answerCard">
    <h2>Ben de seni çok seviyorum</h2>
    <p class="message">Seni her şeyden daha çok seviyorum.<br>Her zaman yanındayım.</p>
  </div>

  <!-- Butonlar -->
  <div class="buttons" id="buttons">
    <button id="yesBtn">Evet, Çok Seviyorum</button>
    <button id="noBtn">Hayır</button>
  </div>

  <script>
    // Hafif ve zarif emoji yağmuru
    const emojis = ['💛', '🌼', '✨'];
    const rain = document.getElementById('rain');

    function createEmoji() {
      const e = document.createElement('div');
      e.className = 'emoji';
      e.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      e.style.left = Math.random() * 100 + 'vw';
      e.style.animationDuration = (Math.random() * 8 + 9) + 's';
      e.style.fontSize = (Math.random() * 0.8 + 1.8) + 'rem';
      rain.appendChild(e);
      setTimeout(() => e.remove(), 20000);
    }

    setInterval(createEmoji, 280);
    for (let i = 0; i < 12; i++) setTimeout(createEmoji, i * 180);

    // Buton İşlemleri
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const questionCard = document.getElementById('questionCard');
    const answerCard = document.getElementById('answerCard');
    const buttonsContainer = document.getElementById('buttons');

    yesBtn.addEventListener('click', () => {
      questionCard.style.opacity = '0';
      setTimeout(() => {
        questionCard.style.display = 'none';
        answerCard.style.display = 'block';
        buttonsContainer.style.display = 'none';
      }, 500);
    });

    // Hayır butonu kaçıyor
    let noClick = 0;
    noBtn.addEventListener('click', () => {
      noClick++;
      const x = Math.random() * (window.innerWidth - 180);
      const y = Math.random() * (window.innerHeight * 0.65);
      
      noBtn.style.position = 'fixed';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
      noBtn.style.transition = 'all 0.4s ease';

      if (noClick > 7) {
        noBtn.textContent = "Pes Ettim";
      }
    });
  </script>
</body>
</html>
